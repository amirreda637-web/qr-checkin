<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>QR Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: black;
      border-radius: 15px;
      overflow: hidden;
    }

    #status {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
      line-height: 1.6;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: #e8f5e9;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      display: none;
    }

  </style>

</head>


<body>

  <h1>QR Check-in</h1>

  <div id="reader"></div>

  <div id="status">
    ⏳ Starting QR scanner...
  </div>

  <div id="result"></div>


  <script>

    const status =
      document.getElementById("status");

    const resultBox =
      document.getElementById("result");


    let scanner = null;

    let scanFinished = false;


    // ==========================================
    // START QR SCANNER
    // ==========================================

    async function startScanner() {

      try {

        status.innerHTML =
          "⏳ Opening rear camera...";


        scanner =
          new Html5Qrcode(
            "reader",
            {
              verbose: false,

              formatsToSupport: [
                Html5QrcodeSupportedFormats.QR_CODE
              ]
            }
          );


        const config = {

          fps: 10,

          qrbox: {
            width: 280,
            height: 280
          },

          aspectRatio: 1.7777778

        };


        // ======================================
        // START BACK CAMERA
        // ======================================

        await scanner.start(

          {
            facingMode: "environment"
          },

          config,

          function(decodedText) {

            if (scanFinished) {
              return;
            }


            scanFinished = true;


            status.innerHTML =
              "✅ QR detected successfully!";


            resultBox.style.display =
              "block";


            resultBox.innerHTML =
              "QR CONTENT:<br><br>" +
              decodedText;


            // Stop after successful scan

            scanner
              .stop()
              .catch(function(error) {

                console.log(
                  "Stop error:",
                  error
                );

              });

          },


          function(errorMessage) {

            // Normal scanning errors are ignored.

          }

        );


        status.innerHTML =
          "📷 Camera is working.<br>" +
          "🔍 Point the camera at the QR code.";


      } catch (error) {

        status.innerHTML =
          "❌ Scanner Error<br><br>" +
          error.name +
          "<br>" +
          error.message;

        console.log(error);

      }

    }


    // ==========================================
    // START AFTER PAGE LOAD
    // ==========================================

    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>

</body>

</html>
