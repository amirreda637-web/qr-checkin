<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>QR Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: black;
      border-radius: 15px;
      overflow: hidden;
    }

    #status {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
      line-height: 1.6;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      display: none;
    }

    .success {
      background: #e8f5e9;
    }

    .error {
      background: #ffebee;
    }

  </style>

</head>


<body>

  <h1>QR Check-in</h1>

  <div id="reader"></div>

  <div id="status">
    ⏳ Starting QR scanner...
  </div>

  <div id="result"></div>


  <script>

    // ==========================================
    // GOOGLE APPS SCRIPT BACKEND
    // ==========================================

    const BACKEND_URL =
      "https://script.google.com/macros/s/AKfycby0nWs74BGWar6ciECXmoID5SCIDanEf2EyQCd4Fevun1SGduKE14kSu38gxZguN9BnGQ/exec";


    const status =
      document.getElementById("status");

    const resultBox =
      document.getElementById("result");


    let scanner = null;

    let scanLocked = false;


    // ==========================================
    // START SCANNER
    // ==========================================

    async function startScanner() {

      try {

        status.innerHTML =
          "⏳ Opening rear camera...";


        scanner =
          new Html5Qrcode(
            "reader",
            {
              verbose: false,

              formatsToSupport: [
                Html5QrcodeSupportedFormats.QR_CODE
              ]
            }
          );


        const config = {

          fps: 10,

          qrbox: {
            width: 280,
            height: 280
          },

          aspectRatio: 1.7777778

        };


        await scanner.start(

          {
            facingMode: "environment"
          },

          config,


          // ======================================
          // QR FOUND
          // ======================================

          async function(decodedText) {

            if (scanLocked) {
              return;
            }


            scanLocked = true;


            status.innerHTML =
              "🎯 QR detected!<br>" +
              "⏳ Sending attendance...";


            // ====================================
            // STOP SCANNER
            // ====================================

            try {

              await scanner.stop();

            } catch (e) {

              console.log(e);

            }


            // ====================================
            // SEND TO GOOGLE APPS SCRIPT
            // ====================================

            sendAttendance(
              decodedText
            );

          },


          // ======================================
          // NORMAL SCAN ERRORS
          // ======================================

          function(errorMessage) {

            // Ignore normal scanning errors.

          }

        );


        status.innerHTML =
          "📷 Camera is working.<br>" +
          "🔍 Point the camera at the QR code.";


      } catch (error) {

        status.innerHTML =
          "❌ Scanner Error<br><br>" +
          error.name +
          "<br>" +
          error.message;

        console.log(error);

      }

    }


    // ==========================================
    // SEND ATTENDANCE
    // ==========================================

    function sendAttendance(personId) {

      const callbackName =
        "attendanceCallback_" +
        Date.now();


      window[callbackName] =
        function(response) {

          try {

            delete window[callbackName];

          } catch (e) {}


          if (
            response &&
            response.success
          ) {

            resultBox.style.display =
              "block";

            resultBox.className =
              "success";


            resultBox.innerHTML =
              "✅ Attendance Recorded!<br><br>" +
              "Name: " +
              response.name +
              "<br>" +
              "ID: " +
              response.id +
              "<br>" +
              "Time: " +
              response.time;


            status.innerHTML =
              "✅ Done";


          } else {

            resultBox.style.display =
              "block";

            resultBox.className =
              "error";


            resultBox.innerHTML =
              "❌ " +
              (
                response &&
                response.message
                  ? response.message
                  : "Unknown error"
              );


            status.innerHTML =
              "⚠️ Attendance was not recorded.";

          }


          // Remove script tag

          if (scriptTag) {

            scriptTag.remove();

          }

        };


      const url =
        BACKEND_URL +
        "?action=record" +
        "&id=" +
        encodeURIComponent(personId) +
        "&callback=" +
        encodeURIComponent(callbackName);


      const scriptTag =
        document.createElement("script");


      scriptTag.src =
        url;


      scriptTag.onerror =
        function() {

          resultBox.style.display =
            "block";

          resultBox.className =
            "error";


          resultBox.innerHTML =
            "❌ Could not connect to server.";


          status.innerHTML =
            "⚠️ Connection error.";


          scanLocked = false;

        };


      document.body.appendChild(
        scriptTag
      );

    }


    // ==========================================
    // START AFTER PAGE LOAD
    // ==========================================

    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>

</body>

</html>
