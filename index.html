<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>QR Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
    }

    h1 {
      margin: 10px 0 15px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: black;
      border-radius: 15px;
      overflow: hidden;
    }

    #status {
      max-width: 500px;
      margin: 15px auto;
      padding: 12px;
      background: white;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.5;
    }

    #result {
      max-width: 500px;
      margin: 15px auto;
      padding: 18px;
      border-radius: 10px;
      font-size: 19px;
      font-weight: bold;
      display: none;
    }

    .success {
      background: #e8f5e9;
    }

    .error {
      background: #ffebee;
    }

    .waiting {
      background: #fff8e1;
    }

  </style>

</head>


<body>

  <h1>QR Check-in</h1>

  <div id="reader"></div>

  <div id="status">
    ⏳ Starting camera...
  </div>

  <div id="result"></div>


  <script>

    // ==========================================
    // BACKEND URL
    // ==========================================

    const BACKEND_URL =
      "https://script.google.com/macros/s/AKfycby0nWs74BGWar6ciECXmoID5SCIDanEf2EyQCd4Fevun1SGduKE14kSu38gxZguN9BnGQ/exec";


    // ==========================================
    // ELEMENTS
    // ==========================================

    const status =
      document.getElementById("status");

    const resultBox =
      document.getElementById("result");


    // ==========================================
    // VARIABLES
    // ==========================================

    let scanner = null;

    let scannerRunning = false;

    let processing = false;

    let lastScannedId = "";

    let lastScanTime = 0;


    // ==========================================
    // START SCANNER
    // ==========================================

    async function startScanner() {

      if (scannerRunning) {
        return;
      }


      try {

        if (!scanner) {

          scanner =
            new Html5Qrcode(
              "reader",
              {
                verbose: false,

                formatsToSupport: [

                  Html5QrcodeSupportedFormats.QR_CODE

                ]

              }
            );

        }


        status.innerHTML =
          "📷 Camera ready.<br>" +
          "🔍 Scan QR code";


        await scanner.start(

          {
            facingMode: "environment"
          },

          {

            fps: 10,

            qrbox: {
              width: 280,
              height: 280
            },

            aspectRatio: 1.7777778

          },


          // ====================================
          // QR DETECTED
          // ====================================

          function(decodedText) {

            handleScan(decodedText);

          },


          // ====================================
          // NORMAL SCAN ERRORS
          // ====================================

          function(errorMessage) {

            // Ignore normal scanning errors.

          }

        );


        scannerRunning = true;


        status.innerHTML =
          "📷 Camera ready.<br>" +
          "🔍 Scan QR code";


      } catch (error) {

        scannerRunning = false;


        status.innerHTML =
          "❌ Scanner Error<br><br>" +
          error.name +
          "<br>" +
          error.message;


        console.log(error);

      }

    }


    // ==========================================
    // HANDLE SCAN
    // ==========================================

    async function handleScan(decodedText) {

      const personId =
        String(decodedText).trim();


      if (!personId) {
        return;
      }


      // ========================================
      // BLOCK MULTIPLE READS
      // ========================================

      if (processing) {
        return;
      }


      const now =
        Date.now();


      if (
        personId === lastScannedId &&
        now - lastScanTime < 3000
      ) {

        return;

      }


      processing = true;

      lastScannedId =
        personId;

      lastScanTime =
        now;


      // ========================================
      // SHOW STATUS
      // ========================================

      status.innerHTML =
        "🎯 QR detected!<br>" +
        "⏳ Recording attendance...";


      resultBox.style.display =
        "none";


      // ========================================
      // STOP DECODING
      // ========================================

      try {

        await scanner.stop();

        scannerRunning = false;

      } catch (error) {

        console.log(
          "Scanner stop:",
          error
        );

      }


      // ========================================
      // SEND TO BACKEND
      // ========================================

      sendAttendance(
        personId
      );

    }


    // ==========================================
    // SEND ATTENDANCE
    // ==========================================

    function sendAttendance(personId) {

      const callbackName =
        "attendance_" +
        Date.now();


      let finished =
        false;


      window[callbackName] =
        function(response) {

          if (finished) {
            return;
          }


          finished = true;


          try {

            delete window[callbackName];

          } catch (e) {}


          // ====================================
          // SUCCESS
          // ====================================

          if (
            response &&
            response.success
          ) {

            resultBox.style.display =
              "block";

            resultBox.className =
              "success";


            resultBox.innerHTML =
              "✅ Attendance Recorded<br><br>" +
              "Name: " +
              response.name +
              "<br>" +
              "Time: " +
              response.time;


            status.innerHTML =
              "✅ Done";


          }


          // ====================================
          // ERROR
          // ====================================

          else {

            resultBox.style.display =
              "block";

            resultBox.className =
              "error";


            resultBox.innerHTML =
              "⚠️ " +
              (
                response &&
                response.message
                  ? response.message
                  : "Attendance was not recorded"
              );


            status.innerHTML =
              "Ready for next scan.";

          }


          // ====================================
          // CLEAN SCRIPT
          // ====================================

          if (scriptTag) {

            scriptTag.remove();

          }


          // ====================================
          // RESTART SCANNER
          // ====================================

          setTimeout(
            function() {

              processing = false;

              startScanner();

            },
            700
          );

        };


      const url =
        BACKEND_URL +
        "?action=record" +
        "&id=" +
        encodeURIComponent(personId) +
        "&callback=" +
        encodeURIComponent(callbackName);


      const scriptTag =
        document.createElement("script");


      scriptTag.src =
        url;


      // ========================================
      // CONNECTION ERROR
      // ========================================

      scriptTag.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;


          resultBox.style.display =
            "block";

          resultBox.className =
            "error";


          resultBox.innerHTML =
            "❌ Server connection error";


          status.innerHTML =
            "⚠️ Try scanning again.";


          processing = false;


          try {

            delete window[callbackName];

          } catch (e) {}


          scriptTag.remove();


          setTimeout(
            function() {

              startScanner();

            },
            700
          );

        };


      document.body.appendChild(
        scriptTag
      );

    }


    // ==========================================
    // START
    // ==========================================

    window.addEventListener(
      "load",
      function() {

        startScanner();

      }
    );

  </script>

</body>

</html>
